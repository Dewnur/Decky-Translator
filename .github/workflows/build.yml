name: Build and Release

on:
  push:
    branches: [main, dev, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version from package.json. Leave empty for a build artifact only.'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.names.outputs.release_tag }}
      zip_name: ${{ steps.names.outputs.zip_name }}
      dependencies_name: ${{ steps.names.outputs.dependencies_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set archive names
        id: names
        env:
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          RELEASE_TAG=""
          if [[ -n "$REQUESTED_VERSION" ]]; then
            if [[ "$REQUESTED_VERSION" != "$VERSION" ]]; then
              echo "Release version must match package.json ($VERSION)" >&2
              exit 1
            fi
            RELEASE_TAG="v$VERSION"
          fi
          INDEX="v$VERSION-build.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "zip_name=Decky.Language.Tutor-$INDEX.zip" >> "$GITHUB_OUTPUT"
          echo "dependencies_name=plugin-dependencies-$INDEX.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and build frontend
        run: |
          pnpm typecheck
          node --test tests/test_phrase_subtitle.mjs
          pnpm build

      - name: Test local phrase extraction
        run: PYTHONPATH=py_modules/providers python3 -m unittest discover -s tests -p test_phrase_extractor.py

      - name: Setup Python 3.13
        if: steps.names.outputs.release_tag != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Create dependencies directory
        if: steps.names.outputs.release_tag != ''
        run: mkdir -p dependencies_build

      - name: Install Python packages (Python 3.13)
        if: steps.names.outputs.release_tag != ''
        run: |
          pip install -r requirements.txt -t dependencies_build/py_modules --no-cache-dir

      - name: Smoke test spaCy without a statistical model
        if: steps.names.outputs.release_tag != ''
        run: |
          printf '%s\n' '["I would count on him showing up."]' |
            python -S py_modules/providers/phrase_extractor.py "$PWD/dependencies_build/py_modules" |
            python -c 'import json, sys; assert [p["canonical"] for p in json.load(sys.stdin)[0]["phrases"]] == ["count on", "show up"]'

      - name: Install cp311 packages for Decky Loader runtime
        if: steps.names.outputs.release_tag != ''
        run: |
          pip install evdev-binary -t dependencies_build/py_modules --no-cache-dir --python-version 3.11 --only-binary=:all: --platform manylinux_2_28_x86_64 --no-deps

      - name: Strip unnecessary packages and test files
        if: steps.names.outputs.release_tag != ''
        run: |
          cd dependencies_build/py_modules
          # Remove packages not needed at runtime (onnxruntime optional deps)
          rm -rf sympy sympy-*.dist-info sympy-*.data isympy.py
          rm -rf mpmath mpmath-*.dist-info
          rm -rf flatbuffers flatbuffers-*.dist-info
          rm -rf protobuf-*.dist-info
          # tqdm is needed by rapidocr 3.x -- do NOT remove
          # Remove full opencv-python (rapidocr pulls it in, but we only need headless)
          rm -rf opencv_python.libs opencv_python-*.dist-info
          # Reinstall headless to overwrite cv2/ module (full version's cv2 references wrong .libs)
          pip install opencv-python-headless -t . --no-cache-dir --upgrade --force-reinstall --no-deps
          # Remove rapidocr bundled models (we use our own)
          rm -rf rapidocr/models
          # rapidocr requires empty folder, otherwise it breaks
          mkdir -p rapidocr/models
          # Strip test directories, __pycache__, and .pyc files
          find . -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "testing" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true
          find . -name "*.pyi" -delete 2>/dev/null || true
          rm -rf numpy/_pyinstaller onnxruntime/datasets
          echo "py_modules size after cleanup: $(du -sh . | cut -f1)"

      - name: Download Python 3.13 portable runtime
        if: steps.names.outputs.release_tag != ''
        run: |
          mkdir -p dependencies_build/python313
          curl -L -o dependencies_build/python313/python-3.13.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20260408/cpython-3.13.13%2B20260408-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz"
          echo "a1dbc39f9c7b7d4ff3074fa18de66714c4e4400643bd657894a65803b0362a92  dependencies_build/python313/python-3.13.tar.gz" | sha256sum -c
          cd dependencies_build/python313 && tar -xzf python-3.13.tar.gz && rm python-3.13.tar.gz

      - name: Create dependencies archive
        if: steps.names.outputs.release_tag != ''
        env:
          DEPENDENCIES_NAME: ${{ steps.names.outputs.dependencies_name }}
        run: |
          cd dependencies_build
          tar -czf "../$DEPENDENCIES_NAME" py_modules python313

      - name: Package plugin ZIP
        env:
          RELEASE_TAG: ${{ steps.names.outputs.release_tag }}
          ZIP_NAME: ${{ steps.names.outputs.zip_name }}
          DEPENDENCIES_NAME: ${{ steps.names.outputs.dependencies_name }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            export DECKY_DEPENDENCIES_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$DEPENDENCIES_NAME"
            export DECKY_DEPENDENCIES_SHA256="$(sha256sum "$DEPENDENCIES_NAME" | cut -d ' ' -f 1)"
          fi
          pnpm package "out/$ZIP_NAME"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          path: out/${{ steps.names.outputs.zip_name }}
          archive: false
          if-no-files-found: error

      - name: Download installer for verification
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.names.outputs.zip_name }}
          path: ${{ runner.temp }}/decky-artifact-check
          skip-decompress: true

      - name: Verify the download is the original ZIP
        env:
          ZIP_NAME: ${{ steps.names.outputs.zip_name }}
        run: cmp "out/$ZIP_NAME" "$RUNNER_TEMP/decky-artifact-check/$ZIP_NAME"

      - name: Upload dependencies artifact
        if: steps.names.outputs.release_tag != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.names.outputs.dependencies_name }}
          archive: false
          if-no-files-found: error

  release:
    if: needs.build.outputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download plugin artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.zip_name }}
          path: ./
          skip-decompress: true

      - name: Download dependencies artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.dependencies_name }}
          path: ./
          skip-decompress: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ needs.build.outputs.zip_name }}
            ${{ needs.build.outputs.dependencies_name }}
          fail_on_unmatched_files: true
          draft: true
          generate_release_notes: true
